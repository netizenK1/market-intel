name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - run: ruff format --check app tests
      - run: ruff check app tests
      - run: mypy app
      - name: Tests (calc_engine coverage must stay >= 95%)
        run: |
          pytest --cov=app --cov-report=term-missing
          pytest tests/calc_engine --cov=app/calc_engine --cov-fail-under=95 -q
      - name: SQL migrations parse
        run: python -c "import pathlib,pglast,sys; [pglast.parse_sql(p.read_text()) for d in ('../../supabase/migrations','../../supabase/seed') for p in sorted(pathlib.Path(d).glob('*.sql'))]; print('ok')"

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          VITE_API_BASE_URL: https://api.example.invalid
      - name: No secrets in bundle
        run: |
          if grep -rEi "service_role|sk-ant-|SUPABASE_SERVICE_ROLE" dist/; then
            echo "Secret-like string found in frontend bundle"; exit 1
          fi

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
